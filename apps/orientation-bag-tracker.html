<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#006BB6">
    <title>Orientation Bag Tracker</title>
    <link rel="manifest" href="../manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .app-container {
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 3px solid #006BB6;
        }

        .logo-container {
            max-width: 130px;
        }

        .logo-container img {
            max-width: 100%;
            height: auto;
        }

        .back-button {
            display: inline-block;
            color: #006BB6;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .back-button:hover {
            text-decoration: underline;
        }

        h1 {
            color: #006BB6;
            margin-bottom: 4px;
            font-size: 1.8rem;
            font-weight: 600;
        }

        .subtitle {
            color: #666;
            margin-bottom: 14px;
            font-size: 1rem;
        }

        /* Settings panel */
        .settings-panel {
            margin-bottom: 14px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            overflow: hidden;
        }

        .settings-panel summary {
            padding: 10px 16px;
            background: #f9f9f9;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88rem;
            color: #555;
            user-select: none;
            list-style: none;
        }

        .settings-panel summary::-webkit-details-marker { display: none; }

        .settings-panel[open] summary {
            border-bottom: 1px solid #e0e0e0;
        }

        .settings-inner {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .settings-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .settings-row .sfield {
            flex: 1;
            min-width: 120px;
        }

        .settings-row .rows-field {
            flex: 0 0 90px;
        }

        .settings-row label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #333;
            font-size: 0.88rem;
        }

        .settings-row input,
        .settings-row textarea {
            width: 100%;
            padding: 9px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .settings-row textarea {
            min-height: 94px;
            resize: vertical;
            line-height: 1.35;
        }

        .settings-row input:focus {
            outline: none;
            border-color: #006BB6;
        }

        .settings-row textarea:focus {
            outline: none;
            border-color: #006BB6;
        }

        .custom-layout-row {
            align-items: flex-start;
        }

        .custom-layout-row button {
            align-self: flex-end;
        }

        .config-summary {
            font-size: 0.83rem;
            color: #555;
            padding: 6px 10px;
            background: #f0f7fc;
            border-radius: 4px;
        }

        /* Main controls */
        .controls {
            display: grid;
            grid-template-columns: minmax(180px, 260px) auto auto;
            gap: 10px;
            margin-bottom: 12px;
            padding: 12px;
            align-items: end;
            background: #f0f7fc;
            border: 1px solid #d5e8f5;
            border-radius: 6px;
        }

        .form-group {
            min-width: 0;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 0.95rem;
        }

        input[type="number"] {
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1rem;
            width: 100%;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #006BB6;
        }

        button {
            background: #006BB6;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #005a94;
        }

        button:active {
            transform: scale(0.98);
        }

        button.reset {
            background: #D22630;
        }

        button.reset:hover {
            background: #b81e28;
        }

        .legend {
            display: flex;
            gap: 14px;
            margin-bottom: 14px;
            padding: 8px 12px;
            background: #f9f9f9;
            border-radius: 6px;
            border-left: 4px solid #006BB6;
            align-items: center;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .legend-box {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 2px solid #333;
            flex-shrink: 0;
        }

        .legend-box.filled {
            background: #006BB6;
        }

        .legend-box.empty {
            background: white;
        }

        .legend-text {
            font-size: 0.88rem;
            font-weight: 500;
            color: #333;
        }

        .room-label {
            text-align: center;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #006BB6;
            padding: 8px;
            background: #f0f7fc;
            border-radius: 6px;
        }

        .seating-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 12px;
            padding: 25px;
            background: #fafafa;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
            position: relative;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            container-type: inline-size;
        }

        .seating-area::before,
        .seating-area::after {
            content: '';
            position: sticky;
            top: 0;
            bottom: 0;
            width: 30px;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .seating-area::before {
            left: 0;
            float: left;
            margin-right: -30px;
            background: linear-gradient(to right, rgba(0, 0, 0, 0.15), transparent);
        }

        .seating-area::after {
            right: 0;
            float: right;
            margin-left: -30px;
            background: linear-gradient(to left, rgba(0, 0, 0, 0.15), transparent);
        }

        .seating-area.show-left-shadow::before { opacity: 1; }
        .seating-area.show-right-shadow::after { opacity: 1; }

        .row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .row-label {
            display: none;
            align-items: center;
            font-weight: 600;
            color: #666;
            min-width: 70px;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .table-group {
            display: flex;
            gap: 6px;
            padding: 4px;
            background: #eef6fb;
            border: 1px solid #d5e8f5;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .table-group + .table-group {
            margin-left: 15px;
        }

        .table-pair {
            display: flex;
            gap: 2px;
            padding: 2px;
            background: white;
            border: 1px solid #b8d4e8;
            border-radius: 5px;
        }

        .chair {
            width: 52px;
            height: 52px;
            border: 2px solid #333;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
            color: #333;
            flex-shrink: 0;
        }

        .chair.filled {
            background: #006BB6;
            color: white;
            border-color: #005a94;
        }

        .chair:hover {
            transform: scale(1.08);
            box-shadow: 0 3px 10px rgba(0, 107, 182, 0.35);
        }

        .summary {
            margin-top: 25px;
            padding: 15px 20px;
            background: #f0f7fc;
            border-radius: 6px;
            font-size: 1rem;
            border-left: 4px solid #006BB6;
        }

        .summary strong {
            color: #006BB6;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            body { padding: 6px; }
            .app-container { padding: 10px; }
            .header {
                flex-direction: row;
                align-items: center;
                gap: 10px;
                margin-bottom: 10px;
                padding-bottom: 8px;
                border-bottom-width: 2px;
            }
            .logo-container { max-width: 96px; }
            .back-button {
                font-size: 0.78rem;
                white-space: nowrap;
            }
            h1 {
                font-size: 1.22rem;
                line-height: 1.15;
                margin-bottom: 6px;
            }
            .subtitle { display: none; }
            .controls {
                grid-template-columns: minmax(0, 1fr) auto auto;
                gap: 6px;
                margin-bottom: 8px;
                padding: 8px;
                align-items: stretch;
            }
            .controls label {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border: 0;
            }
            .form-group { width: auto; }
            input[type="number"] {
                width: 100%;
                height: 38px;
                padding: 8px 10px;
                font-size: 0.95rem;
            }
            button {
                width: auto;
                min-width: 58px;
                height: 38px;
                padding: 0 10px;
                font-size: 0.86rem;
                line-height: 1;
            }
            .settings-panel {
                margin-bottom: 8px;
                border-radius: 5px;
            }
            .settings-panel summary {
                padding: 8px 10px;
                font-size: 0.8rem;
            }
            .settings-inner {
                padding: 10px;
                gap: 8px;
            }
            .settings-row {
                display: grid;
                grid-template-columns: 74px minmax(0, 1fr) auto;
                gap: 6px;
                align-items: end;
            }
            .settings-row .sfield { min-width: 0; }
            .settings-row .rows-field { flex-basis: auto; }
            .settings-row label {
                margin-bottom: 4px;
                font-size: 0.72rem;
                line-height: 1.15;
            }
            .settings-row input,
            .settings-row textarea {
                padding: 7px 8px;
                font-size: 0.85rem;
                border-width: 1px;
            }
            .settings-row input {
                height: 36px;
            }
            .settings-row textarea {
                min-height: 78px;
            }
            .settings-row button {
                width: auto;
                min-width: 54px;
                padding: 0 9px;
            }
            .custom-layout-row {
                grid-template-columns: minmax(0, 1fr);
            }
            .custom-layout-row button {
                width: 100%;
                height: 34px;
            }
            .config-summary {
                padding: 5px 8px;
                font-size: 0.74rem;
            }
            .legend {
                gap: 10px;
                margin-bottom: 8px;
                padding: 6px 8px;
                border-left-width: 3px;
            }
            .legend-item { gap: 5px; }
            .legend-box {
                width: 12px;
                height: 12px;
                border-width: 1px;
            }
            .legend-text { font-size: 0.75rem; }
            .legend-tip { display: none; }
            .seating-area {
                margin-top: 8px;
                padding: 8px;
                gap: 10px;
            }
            .row { justify-content: flex-start; }
            .row-label { min-width: 50px; font-size: 0.8rem; }
            .room-label {
                font-size: 0.78rem;
                padding: 5px;
                margin-bottom: 6px;
            }
            .summary {
                font-size: 0.84rem;
                margin-top: 10px;
                padding: 8px 10px;
            }
        }

        @media (max-width: 768px) and (orientation: portrait) {
            .seating-area {
                overflow-x: visible;
                padding: 5px;
            }
            .seating-area::before,
            .seating-area::after {
                display: none;
            }
            .row {
                gap: 3px;
                justify-content: flex-start;
            }
            .row-label {
                min-width: 34px;
                font-size: clamp(0.58rem, 1.8vw, 0.7rem);
            }
            .chair {
                width: clamp(12px, calc((100cqw - 84px) / var(--max-row-seats, 18)), 28px);
                height: clamp(12px, calc((100cqw - 84px) / var(--max-row-seats, 18)), 28px);
                border-width: 1px;
                border-radius: 3px;
                font-size: clamp(0.42rem, 1.8vw, 0.62rem);
            }
            .chair:hover {
                transform: none;
                box-shadow: none;
            }
            .table-group { gap: 2px; padding: 2px; border-radius: 4px; }
            .table-group + .table-group { margin-left: 4px; }
            .table-pair { gap: 1px; padding: 1px; border-radius: 3px; }
        }

        @media (max-width: 1024px) and (orientation: landscape) {
            .seating-area { padding: 10px 15px; overflow-x: visible; }
            .row { gap: 3px; justify-content: flex-start; }
            .chair { width: 35px; height: 35px; font-size: 0.7rem; border-width: 1.5px; }
            .table-group { gap: 3px; padding: 3px; }
            .table-group + .table-group { margin-left: 6px; }
            .table-pair { gap: 1px; padding: 1px; }
            .row-label { min-width: 40px; font-size: 0.7rem; }
            .seating-area::before, .seating-area::after { display: none; }
        }

        @media (min-width: 1025px) and (orientation: landscape) {
            .chair { width: 52px; height: 52px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="app-container">
            <div class="header">
                <div class="logo-container">
                    <img src="../images/ballad-logo.jpg" alt="Ballad Health Logo" id="logo">
                </div>
                <a href="../index.html" class="back-button">← Back to Home</a>
            </div>

            <h1>Orientation Bag Tracker</h1>
            <p class="subtitle">Day One Orientation Seating Management</p>

            <div class="controls">
                <div class="form-group">
                    <label for="numTMs">Number of Team Members:</label>
                    <input type="number" inputmode="numeric" pattern="[0-9]*" id="numTMs" min="1" placeholder="Team members">
                </div>
                <button onclick="placeBags()">Place</button>
                <button class="reset" onclick="resetAll()">Reset</button>
            </div>

            <details class="settings-panel">
                <summary>Configure Table Layout</summary>
                <div class="settings-inner">
                    <div class="settings-row">
                        <div class="sfield rows-field">
                            <label for="cfgRows">Rows</label>
                            <input type="number" id="cfgRows" min="1" max="30" value="6">
                        </div>
                        <div class="sfield">
                            <label for="cfgLayout">Table groups per row</label>
                            <input type="text" id="cfgLayout" placeholder="e.g. 6,6,4">
                        </div>
                        <button onclick="applyRepeatedLayout()">Apply</button>
                    </div>
                    <div class="settings-row custom-layout-row">
                        <div class="sfield">
                            <label for="cfgRowLayouts">Custom rows</label>
                            <textarea id="cfgRowLayouts" spellcheck="false" placeholder="6,6,4&#10;6,6,4&#10;4,4,4,4"></textarea>
                        </div>
                        <button onclick="applyCustomLayout()">Apply Custom</button>
                    </div>
                    <p class="config-summary" id="configSummary"></p>
                </div>
            </details>

            <div class="legend">
                <div class="legend-item">
                    <div class="legend-box filled"></div>
                    <span class="legend-text">Bag Placed</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box empty"></div>
                    <span class="legend-text">Empty Chair</span>
                </div>
                <div class="legend-item legend-tip">
                    <span class="legend-text"><strong>Tip:</strong> Click any chair to toggle</span>
                </div>
            </div>

            <div class="room-label">FRONT OF ROOM</div>

            <div class="seating-area" id="seatingArea"></div>

            <div class="summary" id="summary" style="display: none;">
                <strong>Bags Placed:</strong> <span id="bagCount">0</span> / <span id="totalCount">0</span> chairs
            </div>
        </div>
    </div>

    <script src="../firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script>
        document.getElementById('logo').onerror = function() { this.style.display = 'none'; };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const myClientId = Date.now().toString(36) + Math.random().toString(36).substr(2);

        // Layout state - every number is a seat count, with two seats per table.
        let rows = 6;
        let layout = [6, 6, 6];
        let rowLayouts = makeRepeatedRowLayouts(rows, layout);
        let totalChairs = 108;
        let chairStates = new Array(108).fill(false);
        let fillPriority = [];

        function makeRepeatedRowLayouts(rowCount, rowLayout) {
            return Array.from({ length: rowCount }, () => rowLayout.slice());
        }

        function cloneRowLayouts(layoutRows) {
            return layoutRows.map(rowLayout => rowLayout.slice());
        }

        function isSameRowLayout(layoutRows) {
            if (layoutRows.length === 0) return true;
            const first = JSON.stringify(layoutRows[0]);
            return layoutRows.every(rowLayout => JSON.stringify(rowLayout) === first);
        }

        function rowSeatCount(rowLayout) {
            return rowLayout.reduce((a, b) => a + b, 0);
        }

        function countTotalChairs(layoutRows) {
            return layoutRows.reduce((sum, rowLayout) => sum + rowSeatCount(rowLayout), 0);
        }

        function countTables(layoutRows) {
            return layoutRows.reduce((sum, rowLayout) => {
                return sum + rowLayout.reduce((rowSum, groupSeats) => rowSum + (groupSeats / 2), 0);
            }, 0);
        }

        function chairsPerRow() {
            return rowLayouts.length ? rowSeatCount(rowLayouts[0]) : 0;
        }

        function maxSeatsPerRow() {
            return Math.max(...rowLayouts.map(rowSeatCount), 1);
        }

        function validateRowLayouts(layoutRows) {
            if (!layoutRows.length) return 'Enter at least one row layout.';
            if (layoutRows.length > 30) return 'Use 30 rows or fewer.';

            for (let rowIndex = 0; rowIndex < layoutRows.length; rowIndex++) {
                const rowLayout = layoutRows[rowIndex];
                if (!rowLayout.length) return `Row ${rowIndex + 1} needs at least one table group.`;

                for (let groupIndex = 0; groupIndex < rowLayout.length; groupIndex++) {
                    const groupSeats = rowLayout[groupIndex];
                    if (!Number.isInteger(groupSeats) || groupSeats < 2) {
                        return `Row ${rowIndex + 1}, group ${groupIndex + 1} must be at least 2 seats.`;
                    }
                    if (groupSeats % 2 !== 0) {
                        return `Row ${rowIndex + 1}, group ${groupIndex + 1} must be even because each table has 2 seats.`;
                    }
                }
            }

            if (countTotalChairs(layoutRows) > 300) return 'Use 300 chairs or fewer.';
            return '';
        }

        function parseGroupList(rawValue) {
            const tokens = rawValue
                .trim()
                .split(/[,\s-]+/)
                .map(token => token.trim())
                .filter(Boolean);

            if (!tokens.length) return [];
            return tokens.map(token => Number.parseInt(token, 10));
        }

        function parseCustomRows(rawValue) {
            return rawValue
                .split(/[\n;]+/)
                .map(row => parseGroupList(row))
                .filter(rowLayout => rowLayout.length > 0);
        }

        function normalizeChairStates(states, chairCount) {
            const normalized = new Array(chairCount).fill(false);
            if (!Array.isArray(states)) return normalized;

            for (let i = 0; i < Math.min(states.length, chairCount); i++) {
                normalized[i] = !!states[i];
            }

            return normalized;
        }

        function applyLayoutState(layoutRows, states) {
            rowLayouts = cloneRowLayouts(layoutRows);
            rows = rowLayouts.length;
            layout = rowLayouts[0] ? rowLayouts[0].slice() : [];
            totalChairs = countTotalChairs(rowLayouts);
            chairStates = normalizeChairStates(states, totalChairs);
            fillPriority = generateFillPriority(rowLayouts);
        }

        function getSavedRowLayouts(data) {
            if (Array.isArray(data.rowLayouts)) {
                const savedRows = data.rowLayouts
                    .filter(rowLayout => Array.isArray(rowLayout))
                    .map(rowLayout => rowLayout.map(value => Number.parseInt(value, 10)));
                if (!validateRowLayouts(savedRows)) return savedRows;
            }

            const legacyRows = Number.parseInt(data.rows, 10) || rows;
            const legacyLayout = Array.isArray(data.layout)
                ? data.layout.map(value => Number.parseInt(value, 10))
                : layout;
            const fallbackRows = makeRepeatedRowLayouts(legacyRows, legacyLayout);

            return validateRowLayouts(fallbackRows) ? rowLayouts : fallbackRows;
        }

        function formatRowLayout(rowLayout) {
            return rowLayout.join('-');
        }

        function formatLayoutSummary() {
            const totalTables = countTables(rowLayouts);
            if (isSameRowLayout(rowLayouts)) {
                const perRowTables = rowLayouts[0].reduce((sum, groupSeats) => sum + (groupSeats / 2), 0);
                return `${rows} rows · groups ${formatRowLayout(rowLayouts[0])} · ${perRowTables} tables per row · ${totalChairs} chairs total`;
            }

            return `${rows} custom rows · ${totalTables} tables · ${totalChairs} chairs total`;
        }

        // Center-out fill priority for flexible row layouts
        function generateFillPriority(layoutRows) {
            const priority = [];
            let rowStart = 0;

            layoutRows.forEach(rowLayout => {
                const cpr = rowSeatCount(rowLayout);
                const lo = Math.floor((cpr - 1) / 2);
                const hi = lo + (cpr % 2 === 0 ? 1 : 0);

                priority.push(rowStart + lo);
                if (lo !== hi) priority.push(rowStart + hi);

                for (let d = 1; lo - d >= 0 || hi + d < cpr; d++) {
                    if (lo - d >= 0) priority.push(rowStart + lo - d);
                    if (hi + d < cpr) priority.push(rowStart + hi + d);
                }

                rowStart += cpr;
            });

            return priority;
        }

        function saveToFirestore() {
            db.collection('bag-tracker').doc('current').set({
                schemaVersion: 2,
                rows,
                layout,
                rowLayouts,
                chairStates,
                lastClientId: myClientId
            }).catch(error => {
                console.error('Unable to sync bag tracker state:', error);
            });
        }

        function createSeatingLayout() {
            const seatingArea = document.getElementById('seatingArea');
            seatingArea.innerHTML = '';
            seatingArea.style.setProperty('--max-row-seats', maxSeatsPerRow());

            let chairNumber = 0;

            rowLayouts.forEach((rowLayout, row) => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'row';

                const rowLabel = document.createElement('div');
                rowLabel.className = 'row-label';
                rowLabel.textContent = `Row ${row + 1}`;
                rowDiv.appendChild(rowLabel);

                rowLayout.forEach(groupSeats => {
                    const tableGroup = document.createElement('div');
                    tableGroup.className = 'table-group';

                    for (let table = 0; table < groupSeats / 2; table++) {
                        const tablePair = document.createElement('div');
                        tablePair.className = 'table-pair';

                        for (let seat = 0; seat < 2; seat++) {
                            const chair = document.createElement('div');
                            chair.className = 'chair';
                            chair.dataset.chairNum = chairNumber;
                            chair.textContent = chairNumber + 1;

                            chair.addEventListener('click', (function(num) {
                                return function() { toggleChair(num); };
                            })(chairNumber));

                            tablePair.appendChild(chair);
                            chairNumber++;
                        }

                        tableGroup.appendChild(tablePair);
                    }

                    rowDiv.appendChild(tableGroup);
                });

                seatingArea.appendChild(rowDiv);
            });

            updateDisplay();
        }

        function toggleChair(chairNum) {
            chairStates[chairNum] = !chairStates[chairNum];
            updateDisplay();
            saveToFirestore();
        }

        function placeBags() {
            const numTMs = parseInt(document.getElementById('numTMs').value);
            if (!numTMs || numTMs < 1 || numTMs > totalChairs) {
                alert(`Please enter a number between 1 and ${totalChairs}`);
                return;
            }

            chairStates = new Array(totalChairs).fill(false);
            for (let i = 0; i < numTMs && i < fillPriority.length; i++) {
                chairStates[fillPriority[i]] = true;
            }

            updateDisplay();
            saveToFirestore();
        }

        function resetAll() {
            chairStates = new Array(totalChairs).fill(false);
            document.getElementById('numTMs').value = '';
            updateDisplay();
            saveToFirestore();
        }

        function updateDisplay() {
            for (let i = 0; i < totalChairs; i++) {
                const chair = document.querySelector(`[data-chair-num="${i}"]`);
                if (chair) {
                    chair.classList.toggle('filled', !!chairStates[i]);
                }
            }
            const bagCount = chairStates.filter(Boolean).length;
            document.getElementById('bagCount').textContent = bagCount;
            document.getElementById('totalCount').textContent = totalChairs;
            document.getElementById('summary').style.display = 'block';
        }

        function updateConfigUI() {
            document.getElementById('cfgRows').value = rows;
            document.getElementById('cfgLayout').value = layout.join(',');
            document.getElementById('cfgRowLayouts').value = rowLayouts.map(formatRowLayout).join('\n');
            document.getElementById('configSummary').textContent = formatLayoutSummary();
        }

        function applyNewLayout(layoutRows) {
            const validationError = validateRowLayouts(layoutRows);
            if (validationError) {
                alert(validationError);
                return;
            }

            const newTotal = countTotalChairs(layoutRows);
            const layoutLabel = isSameRowLayout(layoutRows)
                ? `${layoutRows.length} rows · ${formatRowLayout(layoutRows[0])}`
                : `${layoutRows.length} custom rows`;

            if (!confirm(`Apply new layout? ${layoutLabel} · ${newTotal} chairs total.\n\nThis will reset all current bag placements.`)) return;

            applyLayoutState(layoutRows, new Array(newTotal).fill(false));
            updateConfigUI();
            createSeatingLayout();
            saveToFirestore();
        }

        function applyRepeatedLayout() {
            const newRows = parseInt(document.getElementById('cfgRows').value);
            const rawLayout = document.getElementById('cfgLayout').value;
            const newLayout = parseGroupList(rawLayout);

            if (!newRows || newRows < 1 || newRows > 30) {
                alert('Rows must be between 1 and 30.');
                return;
            }
            if (newLayout.length === 0) {
                alert('Enter at least one table group (e.g. 6,6,4).');
                return;
            }

            applyNewLayout(makeRepeatedRowLayouts(newRows, newLayout));
        }

        function applyCustomLayout() {
            const newRowLayouts = parseCustomRows(document.getElementById('cfgRowLayouts').value);
            applyNewLayout(newRowLayouts);
        }

        window.addEventListener('load', () => {
            // Initialize with defaults, then load from Firestore
            fillPriority = generateFillPriority(rowLayouts);
            updateConfigUI();
            createSeatingLayout();
            setupScrollIndicators();

            db.collection('bag-tracker').doc('current').onSnapshot(snapshot => {
                if (!snapshot.exists) return;
                const data = snapshot.data();

                const newRowLayouts = getSavedRowLayouts(data);
                const layoutChanged =
                    JSON.stringify(newRowLayouts) !== JSON.stringify(rowLayouts);

                if (layoutChanged) {
                    applyLayoutState(newRowLayouts, data.chairStates);
                    updateConfigUI();
                    createSeatingLayout();
                } else if (data.lastClientId !== myClientId) {
                    chairStates = normalizeChairStates(data.chairStates, totalChairs);
                    updateDisplay();
                }
            }, error => {
                console.error('Unable to load shared bag tracker state:', error);
            });
        });

        function setupScrollIndicators() {
            const seatingArea = document.getElementById('seatingArea');

            function updateScrollShadows() {
                const scrollLeft = seatingArea.scrollLeft;
                const maxScroll = seatingArea.scrollWidth - seatingArea.clientWidth;
                seatingArea.classList.toggle('show-left-shadow', scrollLeft > 10);
                seatingArea.classList.toggle('show-right-shadow', scrollLeft < maxScroll - 10);
            }

            seatingArea.addEventListener('scroll', updateScrollShadows);
            window.addEventListener('resize', updateScrollShadows);
            setTimeout(updateScrollShadows, 100);
        }
    </script>
</body>
</html>
